name: Update agent plugins
description: >
  Pin plugin marketplaces in .claude/settings.json and .codex/config.toml to the
  same commit, bootstrap missing configs, open a PR, and enable auto-merge.
author: Cedric Ziel

inputs:
  marketplace:
    description: Marketplace name as used in enabledPlugins (`plugin@marketplace`).
    default: cedricziel
  repo:
    description: GitHub repo (owner/name) that hosts the marketplace.
    default: cedricziel/claude-plugins
  plugins:
    description: >
      Comma-separated plugins to enable when the config is bootstrapped. Existing
      enabledPlugins entries are never touched.
    default: oss
  ref:
    description: Branch or tag to track. Kept from the existing entry if one is set.
    default: main
  settings-file:
    description: Settings file to create or update. Set to an empty string to skip this host.
    default: .claude/settings.json
  codex-config:
    description: Codex project config to create or update. Set to an empty string to skip Codex.
    default: .codex/config.toml
  codex-plugins:
    description: >
      Comma-separated Codex plugins to enable when its marketplace is bootstrapped.
      Independent of plugins; existing choices are preserved. Personal plugins are opt-in.
    default: common,oss
  session-hook:
    description: >
      "true" adds a SessionStart hook that installs the plugins in remote (cloud) sessions,
      where settings.json alone does not install them. Existing hook scripts are never overwritten.
    default: "true"
  token:
    description: >
      Token used to push, open the PR, and enable auto-merge. Use a PAT or GitHub App
      token if the PR must trigger required checks; PRs opened with GITHUB_TOKEN do not.
    default: ${{ github.token }}
  merge-method:
    description: squash, merge, or rebase.
    default: squash
  base:
    description: Branch the PR targets.
    default: ${{ github.event.repository.default_branch }}

outputs:
  changed:
    description: "true if either config or the install hook changed."
    value: ${{ steps.update.outputs.changed }}
  bootstrapped:
    description: "true if a marketplace entry was created in either config."
    value: ${{ steps.update.outputs.bootstrapped }}
  sha:
    description: Commit the marketplace is now pinned to.
    value: ${{ steps.update.outputs.sha }}
  pull-request:
    description: URL of the PR, empty when nothing changed.
    value: ${{ steps.pr.outputs.url }}

runs:
  using: composite
  steps:
    - id: update
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SETTINGS: ${{ inputs.settings-file }}
        MARKETPLACE: ${{ inputs.marketplace }}
        REPO: ${{ inputs.repo }}
        PLUGINS: ${{ inputs.plugins }}
        REF: ${{ inputs.ref }}
        SESSION_HOOK: ${{ inputs.session-hook }}
        CODEX_CONFIG: ${{ inputs.codex-config }}
        CODEX_PLUGINS: ${{ inputs.codex-plugins }}
      run: |
        set -euo pipefail
        for path in "$SETTINGS" "$CODEX_CONFIG"; do
          case "$path" in
            /* | *..* | *$'\n'* | *$'\r'*) echo "::error::Config paths must be relative and inside the repo"; exit 1 ;;
          esac
        done
        if [ -n "$SETTINGS" ] && git check-ignore -q "$SETTINGS"; then
          echo "::warning::${SETTINGS} is gitignored. Skipping this host."
          SETTINGS=""
        fi
        if [ -n "$CODEX_CONFIG" ] && git check-ignore -q "$CODEX_CONFIG"; then
          echo "::warning::${CODEX_CONFIG} is gitignored. Skipping Codex."
          CODEX_CONFIG=""
        fi
        deps=$(mktemp -d)
        trap 'rm -rf "$deps"' EXIT
        python3 -m pip install --disable-pip-version-check --target "$deps" -r "$ACTION_PATH/requirements.txt"
        args=()
        if [ "$SESSION_HOOK" = "true" ]; then args+=(--session-hook); fi
        PYTHONPATH="$deps${PYTHONPATH:+:$PYTHONPATH}" python3 "$ACTION_PATH/update_settings.py" \
          --settings "$SETTINGS" \
          --marketplace "$MARKETPLACE" \
          --repo "$REPO" \
          --plugins "$PLUGINS" \
          --ref "$REF" \
          --codex-config "$CODEX_CONFIG" \
          --codex-plugins "$CODEX_PLUGINS" \
          ${args[@]+"${args[@]}"} | tee -a "$GITHUB_OUTPUT"

    - id: pr
      if: steps.update.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SETTINGS: ${{ steps.update.outputs.settings }}
        MARKETPLACE: ${{ inputs.marketplace }}
        SHA: ${{ steps.update.outputs.sha }}
        HOOK: ${{ steps.update.outputs.hook }}
        CODEX_CONFIG: ${{ steps.update.outputs.codex }}
        BOOTSTRAPPED: ${{ steps.update.outputs.bootstrapped }}
        BASE: ${{ inputs.base }}
        METHOD: ${{ inputs.merge-method }}
      run: |
        set -euo pipefail
        branch="claude-plugins/update-${MARKETPLACE}"
        short="${SHA:0:7}"
        if [ "$BOOTSTRAPPED" = "true" ]; then
          title="chore(plugins): add ${MARKETPLACE} plugins at ${short}"
        else
          title="chore(plugins): update ${MARKETPLACE} plugins to ${short}"
        fi
        body="Pins the \`${MARKETPLACE}\` marketplace to \`${SHA}\`."
        if [ -n "$SETTINGS" ]; then
          body+=" Updates \`${SETTINGS}\`."
        fi
        if [ -n "$CODEX_CONFIG" ]; then
          body+=" Updates \`${CODEX_CONFIG}\` to the same commit, preserving existing plugin choices."
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$branch"
        git add ${SETTINGS:+"$SETTINGS"} ${HOOK:+"$HOOK"} ${CODEX_CONFIG:+"$CODEX_CONFIG"}
        git commit -m "$title"
        git push --force-with-lease -u origin "$branch" ||
          git push --force -u origin "$branch"

        url=$(gh pr list --head "$branch" --base "$BASE" --state open --json url --jq '.[0].url')
        if [ -n "$url" ]; then
          gh pr edit "$url" --title "$title" --body "$body"
        else
          url=$(gh pr create --head "$branch" --base "$BASE" --title "$title" --body "$body")
        fi
        echo "url=$url" >> "$GITHUB_OUTPUT"

        gh pr merge "$url" --auto "--${METHOD}" ||
          echo "::warning::Could not enable auto-merge. Enable 'Allow auto-merge' in repo settings and require at least one status check on ${BASE}."
