name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate.py

  claude-plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.278
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate . --strict
          for dir in plugins/*/; do
            claude plugin validate "$dir" --strict
          done

  codex-plugin-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g @openai/codex@0.155.1
      # Codex has no `validate` command; adding each plugin from the marketplace
      # parses .agents/plugins/marketplace.json and the plugin's .codex-plugin/plugin.json.
      - name: Install every Codex plugin from the local marketplace
        run: |
          export CODEX_HOME="$(mktemp -d)"
          codex plugin marketplace add .
          for manifest in plugins/*/.codex-plugin/plugin.json; do
            name="$(basename "$(dirname "$(dirname "$manifest")")")"
            codex plugin add "$name@cedricziel"
          done
